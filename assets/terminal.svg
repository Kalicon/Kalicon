<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeIn {
        0%, 15% { opacity: 0; }
        25%, 100% { opacity: 1; }
      }
      .window-bg { fill: #0D1117; stroke: #30363D; stroke-width: 1.5; rx: 12px; }
      .window-header { fill: #161B22; rx: 12px 12px 0 0; }
      .dot-red { fill: #FF5F56; }
      .dot-yellow { fill: #FFBD2E; }
      .dot-green { fill: #27C93F; }
      .header-title { fill: #8B949E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; }
      .t-prompt { fill: #38BDF8; font-family: "Fira Code", monospace; font-weight: 600; font-size: 13.5px; }
      .t-dir { fill: #A5D6FF; font-family: "Fira Code", monospace; font-weight: 600; font-size: 13.5px; }
      .t-cmd { fill: #F0F6FC; font-family: "Fira Code", monospace; font-weight: 500; font-size: 13.5px; }
      .cursor { fill: #38BDF8; animation: blink 0.9s infinite; }
      .t-bracket { fill: #E6EDF3; font-family: "Fira Code", monospace; font-size: 13px; font-weight: 600; }
      .t-key { fill: #7EE787; font-family: "Fira Code", monospace; font-size: 13px; }
      .t-colon { fill: #8B949E; font-family: "Fira Code", monospace; font-size: 13px; }
      .t-str { fill: #79C0FF; font-family: "Fira Code", monospace; font-size: 13px; }
      .t-val-special { fill: #FFA657; font-family: "Fira Code", monospace; font-size: 13px; }
      .json-output { animation: fadeIn 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Janela do Terminal -->
  <rect class="window-bg" x="2" y="2" width="756" height="386" rx="12" />

  <!-- Barra Superior Estilo macOS -->
  <rect class="window-header" x="2" y="2" width="756" height="38" rx="12" />
  <circle class="dot-red" cx="24" cy="20" r="5.5" />
  <circle class="dot-yellow" cx="42" cy="20" r="5.5" />
  <circle class="dot-green" cx="60" cy="20" r="5.5" />
  <text class="header-title" x="380" y="25" text-anchor="middle">zsh — kalicon@fiap-dev:~</text>

  <!-- Linha de Comando -->
  <text class="t-prompt" x="28" y="74">➜</text>
  <text class="t-dir" x="48" y="74">~</text>
  <text class="t-cmd" x="66" y="74">./status.sh --profile</text>
  <rect class="cursor" x="245" y="60" width="8.5" height="17" rx="1" />

  <!-- Bloco de Resposta JSON (100% dentro da janela com padding) -->
  <g class="json-output">
    <text class="t-bracket" x="28" y="106">{</text>

    <!-- Linha 1: dev -->
    <text class="t-key" x="52" y="132">"desenvolvedor"</text>
    <text class="t-colon" x="175" y="132">:</text>
    <text class="t-str" x="190" y="132">"Kalicon Amorim"</text>
    <text class="t-colon" x="325" y="132">,</text>

    <!-- Linha 2: formacao -->
    <text class="t-key" x="52" y="158">"formacao"</text>
    <text class="t-colon" x="130" y="158">:</text>
    <text class="t-str" x="145" y="158">"Análise e Desenvolvimento de Sistemas @ FIAP (2026)"</text>
    <text class="t-colon" x="575" y="158">,</text>

    <!-- Linha 3: metodologia -->
    <text class="t-key" x="52" y="184">"metodologia"</text>
    <text class="t-colon" x="155" y="184">:</text>
    <text class="t-str" x="170" y="184">"Aprender na prática construindo projetos reais"</text>
    <text class="t-colon" x="560" y="184">,</text>

    <!-- Linha 4: ia_superpower -->
    <text class="t-key" x="52" y="210">"ia_superpower"</text>
    <text class="t-colon" x="175" y="210">:</text>
    <text class="t-str" x="190" y="210">"Desenvolvimento acelerado por Inteligência Artificial"</text>
    <text class="t-colon" x="625" y="210">,</text>

    <!-- Linha 5: projetos_reais -->
    <text class="t-key" x="52" y="236">"projetos_reais"</text>
    <text class="t-colon" x="180" y="236">:</text>
    <text class="t-bracket" x="195" y="236">[</text>
    <text class="t-val-special" x="205" y="236">"Claravellas"</text>
    <text class="t-colon" x="315" y="236">, </text>
    <text class="t-val-special" x="330" y="236">"RHUB"</text>
    <text class="t-colon" x="380" y="236">, </text>
    <text class="t-val-special" x="395" y="236">"Hospital SES-SP"</text>
    <text class="t-colon" x="535" y="236">, </text>
    <text class="t-val-special" x="550" y="236">"IntraHub"</text>
    <text class="t-bracket" x="635" y="236">]</text>
    <text class="t-colon" x="642" y="236">,</text>

    <!-- Linha 6: stack -->
    <text class="t-key" x="52" y="262">"stack_principal"</text>
    <text class="t-colon" x="195" y="262">:</text>
    <text class="t-bracket" x="210" y="262">[</text>
    <text class="t-str" x="220" y="262">"Java 17"</text>
    <text class="t-colon" x="290" y="262">, </text>
    <text class="t-str" x="305" y="262">"Spring Boot 3"</text>
    <text class="t-colon" x="425" y="262">, </text>
    <text class="t-str" x="440" y="262">"Node.js"</text>
    <text class="t-colon" x="510" y="262">, </text>
    <text class="t-str" x="525" y="262">"MongoDB"</text>
    <text class="t-bracket" x="605" y="262">]</text>
    <text class="t-colon" x="612" y="262">,</text>

    <!-- Linha 7: status -->
    <text class="t-key" x="52" y="288">"status_atual"</text>
    <text class="t-colon" x="165" y="288">:</text>
    <text class="t-str" x="180" y="288">"Estudando, codando e entregando software todo dia"</text>

    <text class="t-bracket" x="28" y="320">}</text>
  </g>
</svg>
